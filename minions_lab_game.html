function timeExpired(){if(!questionDeadline||!playing||active<0)return;playGameSound('wrong');questionDeadline=0;remain=Math.max(0,remain-1);label();if(remain===0){questionDeadline=0;playing=false;view((C.loseImage?'<img class="finish-picture" src="'+esc(C.loseImage)+'" alt="Проигрыш">':'')+'<h1>'+esc(C.loseText||'Игра окончена')+'</h1><button class="action" id="again">'+esc(C.restartText||'Играть снова')+'</button>');document.getElementById('again').onclick=start}else{active=-1;hide()}}function tick(t){if(questionDeadline&&playing){let left=questionDeadline-t;let bar=document.getElementById('timeFill');if(bar){bar.style.width=Math.max(0,Math.min(100,left/(Math.max(5,Math.min(600,Number(C.timerSeconds)||30))*1000)*100))+'%';bar.style.backgroundColor=left<5000?'#e36b70':'#65b99b'}if(left<=0)timeExpired()}if(!last)last=t;let dt=Math.min(.05,(t-last)/1000);last=t;if(playing&&!paused&&bookPanel.hidden){let r=scene.getBoundingClientRect(),sz=Math.min(130,Math.max(40,Number(C.size)||80)),edge=sz/2,top=60+edge,bottom=Math.max(top+1,r.height-edge);items.forEach((p,i)=>{if(!p.alive||!p.el)return;p.phase+=dt;let turn=(Math.sin(p.phase*1.37+i*6.1)+Math.sin(p.phase*.81+i*2.3))*.35*dt;let nx=p.vx*Math.cos(turn)-p.vy*Math.sin(turn),ny=p.vx*Math.sin(turn)+p.vy*Math.cos(turn);p.vx=nx;p.vy=ny;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<edge){p.x=edge;p.vx=Math.abs(p.vx)}if(p.x>r.width-edge){p.x=r.width-edge;p.vx=-Math.abs(p.vx)}if(p.y<top){p.y=top;p.vy=Math.abs(p.vy)}if(p.y>bottom){p.y=bottom;p.vy=-Math.abs(p.vy)}p.el.style.transform='translate(-50%,-50%) rotate('+(Math.sin(p.phase*2+i)*9)+'deg)';p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'})}requestAnimationFrame(tick)}requestAnimationFrame(tick);view('<h1>'+esc(C.titleText||'Летающие предметы')+'</h1><p>'+esc(C.storyText||'Выполни задания')+'</p><button class="action" id="begin">'+esc(C.startText||'Начать')+'</button>');document.getElementById('begin').onclick=()=>{if(!hasSprites){view('<h1>Добавьте предметы</h1><p>Откройте вкладку «Своя
